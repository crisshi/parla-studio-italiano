<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Che lavoro fai?</title><link rel="stylesheet" href="complete.css"><style>body{background:#f4f0e8}.wrap{max-width:1160px}.panel{padding-top:42px}.section-head{max-width:none}.word,.patterns,.talk,.reading{max-width:none}.audio{display:inline-grid;place-items:center;width:30px;height:30px;border:1px solid #ccd1d9;border-radius:50%;background:#fff;color:#4c55a7;vertical-align:middle;cursor:pointer}.audio:hover{background:#fff5e8}.word blockquote{margin:11px 0;background:#f7f0df;border-left:2px solid #e2a82e;padding:11px 14px}.word aside span{font-size:12px;padding:6px 8px;background:#eef0f3}.tools{max-width:none;background:#fff;padding:16px;border:1px solid #d9d2c8;border-left:5px solid #d85045}.tools button{border:0;background:#16243a;color:#fff;padding:10px 16px;border-radius:999px;font-weight:bold}.reading{padding:30px;background:#fffdf9;border-top:3px solid #16243a;box-shadow:8px 8px #e5dbc8}.reading p{font:21px/1.7 Georgia}.cn{display:block;color:#bd5c55;font:14px Arial;margin-top:6px}.toggle{float:right;border:1px solid #c7cdd5;background:#fff;color:#4c55a7;padding:8px 12px;border-radius:999px;cursor:pointer}.hidden{display:none}.card{background:#fffdf9;border-top:3px solid #16243a;box-shadow:7px 7px #e5dbc8;padding:24px;margin-bottom:24px;font:18px/1.6 Georgia}.card h3{margin-top:0}.ex{font-weight:bold}.chips button{margin:4px;padding:7px 10px}.blank{display:inline-block;min-width:90px;border-bottom:1px solid #4c55a7;text-align:center;color:#4c55a7;cursor:pointer}@media(max-width:700px){.wrap{padding:0 20px}.word,.patterns{grid-template-columns:1fr}}</style><body><main class="wrap"><header><a href="index.html">parla<span>·</span>studio</a><small>ITALIANO A1 · CONVERSAZIONE 03</small></header><section class="hero"><div><b>PRIME CONVERSAZIONI</b><h1>Che lavoro <i>fai</i>?</h1><p class="cn">中文：你做什么工作？</p><p>学习谈论居住地、职业与工作地点。</p></div></section><nav><button class="active" data-t="w">Parole</button><button data-t="d">Dialogo</button><button data-t="m">Da ricordare</button><button data-t="e">Esercizio</button><button data-t="p">Parliamone</button></nav><section id="w" class="panel active"><div class="section-head"><div><b>VOCABOLARIO</b><h2>8 espressioni chiave</h2></div></div><div id="words"></div></section><section id="d" class="panel"><div class="section-head"><div><b>DIALOGO</b><h2>Arisa e Haruto</h2></div></div><div class="tools"><button id="all">▶ Ascolta il dialogo</button><span id="state">朗读使用浏览器意大利语语音</span></div><article class="reading" id="dialog"></article></section><section id="m" class="panel"><div class="section-head"><div><b>DA MEMORIZZARE</b><h2>Frasi da usare subito</h2></div></div><div id="patterns" class="patterns"></div></section><section id="e" class="panel"><div class="section-head"><div><b>ESERCIZIO</b><h2>Otto attività</h2></div><button class="toggle">显示中文</button></div><div id="exercise"></div></section><section id="p" class="panel"><div class="section-head"><div><b>DISCUSSIONE</b><h2>Parliamone</h2></div><button class="toggle">显示中文</button></div><div class="talk" id="talk"></div></section></main><script>const say=t=>{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='it-IT';speechSynthesis.speak(u)},B=t=>`<button class="audio" onclick="say('${t.replace(/'/g,"\\'")}')">◖</button>`,W=[['Dove vivi?','问对方住在哪里。','Vivo a Roma.','我住在罗马。','vivi a Milano','住在米兰'],['Vivo a…','说自己居住的城市。','Vivo a Tokyo.','我住在东京。','vivo vicino a…','我住在……附近'],['Che lavoro fai?','询问职业。','Faccio l’insegnante.','我是老师。','che lavoro fai tu?','你做什么工作？'],['Sono infermiere.','说明职业：护士。','Sono infermiere e lavoro in ospedale.','我是护士，在医院工作。','un bravo infermiere','优秀护士'],['Sono insegnante.','说明职业：老师。','Sono insegnante in una scuola.','我是学校老师。','insegnante di italiano','意大利语老师'],['Sono impiegato/a.','办公室职员。','Sono impiegata in un ufficio.','我是办公室职员。','impiegato d’ufficio','办公室职员'],['Lavoro in…','说明工作地点。','Lavoro in un negozio.','我在商店工作。','lavoro da casa','在家工作'],['commesso/a','商店店员。','Mia sorella è commessa.','我姐姐是店员。','commesso di negozio','商店店员']];words.innerHTML=W.map(x=>`<article class="word"><div><h3>${x[0]} ${B(x[0])}</h3><small>espressione utile</small></div><div><p>${x[1]}<span class="cn">中文：${x[1]}</span></p><blockquote>${x[2]} ${B(x[2])}<span class="cn">中文：${x[3]}</span></blockquote><aside><span>${x[4]}<br><em>${x[5]}</em></span></aside></div></article>`).join('');const D=['Buonasera.','Ciao.','Come ti chiami?','Mi chiamo Haruto. E tu?','Mi chiamo Arisa. Piacere di conoscerti.','Piacere mio.','Dove vivi?','Vivo a Tokyo. E tu?','Vivo a Bangkok. Che lavoro fai?','Sono infermiere.','Dove lavori?','Lavoro in un ospedale.','Sono impiegata. Lavoro in un ufficio.','Che bello! Ci vediamo domani.','Arrivederci. A domani.'];dialog.innerHTML=D.map((x,i)=>`<p><b>${i%2?'Haruto':'Arisa'}</b> — ${x} ${B(x)}<span class="cn">中文：${['晚上好。','你好。','你叫什么名字？','我叫 Haruto。你呢？','我叫 Arisa。很高兴认识你。','我也很高兴认识你。','你住在哪里？','我住在东京。你呢？','我住在曼谷。你做什么工作？','我是护士。','你在哪里工作？','我在医院工作。','我是办公室职员，在办公室工作。','真不错，明天见。','再见，明天见。'][i]}</span></p>`).join('');all.onclick=()=>{let i=0;const n=()=>{if(i>=D.length)return state.textContent='Lettura terminata.';let u=new SpeechSynthesisUtterance(D[i++]);u.lang='it-IT';u.onend=n;speechSynthesis.speak(u)};say('');state.textContent='Lettura italiana in corso…';n()};const P=['Dove vivi? — Vivo a Napoli.','Vivo a Taipei.','Che lavoro fai? — Sono studente.','Sono un insegnante.','Dove lavori? — Lavoro in una scuola.','Lavoro in una scuola.'];patterns.innerHTML=P.map(x=>`<article><h3>${x} ${B(x)}</h3><p>表达地点或职业。</p><span class="cn">中文：${x}</span></article>`).join('');exercise.innerHTML=[1,2,3,4,5,6,7,8].map(i=>`<div class="card"><h3>${i} · Attività ${i}</h3><p>Usa le parole della lezione per completare e parlare.</p><span class="cn">中文：第 ${i} 个原课练习模块，使用本课表达完成练习。</span></div>`).join('');talk.innerHTML=['Dove vivi adesso?','Che lavoro fai?','Dove lavori o studi?','Ti piace il tuo lavoro? Perché?','In quale città vorresti vivere?'].map(x=>`<div>${x} ${B(x)}<span class="cn">中文：${x}</span></div>`).join('');document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===b.dataset.t))});document.querySelectorAll('.toggle').forEach(b=>{let on=false;b.onclick=()=>{on=!on;b.textContent=on?'隐藏中文':'显示中文';b.closest('.panel').querySelectorAll('.cn').forEach(x=>x.classList.toggle('hidden',!on))};b.click()})</script></body></html>
